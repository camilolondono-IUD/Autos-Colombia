<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Autos Colombia</title>

<!-- ruta al CSS -->
<link rel="stylesheet" href="../CSS/login.css">

</head>

<body>

<div class="login-container">

    <h2>Autos Colombia</h2>
    <p>Inicio de sesión</p>

    <form id="loginForm" data-testid="login-form">

        <div class="input-group">
            <label>Usuario</label>
            <input type="text" id="usuario" data-testid="login-username-input" placeholder="Usuario válido: admin">
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" data-testid="login-password-input" placeholder="Contraseña válida: 12345">
        </div>

        <button type="submit" class="btn-login" data-testid="login-submit-button">Iniciar Sesión</button>

        <p id="mensajeError" class="error" data-testid="login-error-message"></p>

    </form>

</div>

<!-- ruta al JS -->
<script src="../JS/login.js"></script>

</body>
</html>
